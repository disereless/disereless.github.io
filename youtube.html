<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disereless — YouTube Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a11;
    --bg-card:#16131e;
    --bg-card-hover:#1e1928;
    --purple:#8b5cf6;
    --purple-light:#a78bfa;
    --purple-deep:#6d28d9;
    --text:#ede9f7;
    --text-dim:#9b93ad;
    --border:#272033;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Outfit','Cairo',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  }
  body[dir="rtl"]{font-family:'Cairo','Outfit',sans-serif}
  .lang-switch{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;
    display:flex;align-items:center;
    direction:ltr; /* EN always left, عربي always right */
    background:var(--bg-card);border:1px solid var(--purple);
    border-radius:999px;padding:4px;cursor:pointer;user-select:none;
    box-shadow:0 4px 22px rgba(139,92,246,.35);
  }
  .lang-switch .opt{
    position:relative;z-index:2;
    padding:7px 18px;border-radius:999px;
    font-size:14px;font-weight:700;color:var(--text-dim);
    transition:color .25s ease;
  }
  .lang-switch .opt.active{color:#fff}
  .lang-knob{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(50% - 4px);border-radius:999px;
    background:linear-gradient(135deg,var(--purple),var(--purple-deep));
    box-shadow:0 2px 12px rgba(139,92,246,.5);
    transition:transform .3s cubic-bezier(.2,1.2,.4,1);z-index:1;
  }
  .lang-switch.ar .lang-knob{transform:translateX(100%)}
  body[dir="rtl"] .back:hover{transform:translateX(3px)}
  .glow{
    position:fixed;border-radius:50%;filter:blur(130px);opacity:.18;z-index:0;pointer-events:none;
    animation:float 14s ease-in-out infinite alternate;
  }
  .glow-1{width:460px;height:460px;background:var(--purple-deep);top:-140px;right:-120px}
  .glow-2{width:380px;height:380px;background:#4c1d95;bottom:-120px;left:-100px;animation-delay:-7s}
  @keyframes float{from{transform:translate(0,0)}to{transform:translate(-40px,35px) scale(1.12)}}

  .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:74px 20px 60px}

  .back{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--text-dim);text-decoration:none;font-weight:600;font-size:14px;
    padding:9px 18px;border:1px solid var(--border);border-radius:999px;
    background:var(--bg-card);transition:all .2s ease;
  }
  .back:hover{color:var(--purple-light);border-color:var(--purple);transform:translateX(-3px)}

  /* channel hero */
  .hero{
    margin-top:26px;
    background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(22,19,30,.85));
    border:1px solid var(--purple-deep);
    border-radius:22px;
    padding:38px 34px;
    display:flex;align-items:center;gap:26px;flex-wrap:wrap;
    animation:rise .5s ease backwards;
  }
  @keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
  .hero-avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,#ff3d3d,#c4302b);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px var(--bg),0 0 0 7px #ff3d3d55,0 10px 40px rgba(255,61,61,.3);
  }
  .hero-avatar svg{width:46px;height:46px}
  .hero-info{flex:1;min-width:230px}
  .hero-info h1{font-size:30px;font-weight:800}
  .hero-info h1 .ar{font-family:'Cairo',sans-serif;color:var(--purple-light);font-size:22px;font-weight:700}
  .hero-handle{color:var(--purple-light);font-weight:600;margin-top:2px}
  .hero-desc{color:var(--text-dim);font-size:14.5px;margin-top:10px;line-height:1.65;max-width:560px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 26px;border-radius:999px;text-decoration:none;
    font-weight:700;font-size:15px;transition:all .22s ease;white-space:nowrap;
  }
  .btn-sub{background:#ff0033;color:#fff;box-shadow:0 6px 24px rgba(255,0,51,.35)}
  .btn-sub:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,0,51,.5)}
  .btn svg{width:20px;height:20px}

  /* section header */
  .section-head{
    display:flex;align-items:center;gap:14px;margin:46px 0 22px;
  }
  .section-head h2{font-size:22px;font-weight:800}
  .section-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--purple-deep),transparent)}
  .badge{
    background:var(--purple-deep);color:#fff;font-size:12px;font-weight:700;
    padding:4px 12px;border-radius:999px;
  }

  /* video grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;
  }
  .video-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;overflow:hidden;
    transition:all .22s ease;
    animation:rise .5s ease backwards;
  }
  .video-card:hover{
    transform:translateY(-4px);
    border-color:var(--purple);
    box-shadow:0 12px 36px rgba(139,92,246,.22);
  }
  .thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  .thumb:hover img{transform:scale(1.05)}
  .play-btn{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }
  .play-btn span{
    width:60px;height:60px;border-radius:50%;
    background:rgba(139,92,246,.92);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    transition:all .2s ease;
  }
  .thumb:hover .play-btn span{transform:scale(1.12);background:var(--purple-light)}
  .play-btn svg{width:24px;height:24px;margin-left:3px}
  .thumb iframe{width:100%;height:100%;border:0;display:block}
  .video-meta{padding:15px 16px 17px}
  .video-title{
    font-weight:700;font-size:15px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-family:'Cairo','Outfit',sans-serif;
  }
  .video-date{color:var(--text-dim);font-size:13px;margin-top:7px}
  .video-link{color:var(--purple-light);font-size:13px;font-weight:600;text-decoration:none}
  .video-link:hover{text-decoration:underline}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px}

  /* states */
  .state{
    text-align:center;padding:70px 20px;color:var(--text-dim);
    background:var(--bg-card);border:1px dashed var(--border);border-radius:18px;
  }
  .state a{color:var(--purple-light);font-weight:700;text-decoration:none}
  .state a:hover{text-decoration:underline}
  .spinner{
    width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
    border:4px solid var(--border);border-top-color:var(--purple);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{color:var(--text-dim);font-size:13px;text-align:center;margin-top:56px}
  footer span{color:var(--purple-light)}

  @media (max-width:600px){
    .hero{padding:28px 22px}
    .hero-info h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="lang-switch" id="langSwitch">
  <div class="lang-knob"></div>
  <div class="opt active" data-lang="en">EN</div>
  <div class="opt" data-lang="ar">عربي</div>
</div>

<div class="wrap">
  <a class="back" href="index.html" data-i18n="back">← Back to all links</a>

  <div class="hero">
    <div class="hero-avatar">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M10 15.5v-7l6 3.5-6 3.5z"/><path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.4a2.8 2.8 0 0 0-2 2A29.4 29.4 0 0 0 2 12a29.4 29.4 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.4 7.6.4 7.6.4s5.9 0 7.6-.4a2.8 2.8 0 0 0 2-2A29.4 29.4 0 0 0 22 12a29.4 29.4 0 0 0-.4-4.8z" fill="none" stroke="#fff" stroke-width="1.4"/></svg>
    </div>
    <div class="hero-info">
      <h1>Disereless <span class="ar">— حارث</span></h1>
      <div class="hero-handle" data-i18n="handle">@disereless on YouTube</div>
      <p class="hero-desc" data-i18n="desc">Iraqi speedrunner 🎮 God of War speedruns — the easiest skips and the fastest routes through every stage. New guides and runs on the channel.</p>
    </div>
    <a class="btn btn-sub" href="https://www.youtube.com/@disereless?sub_confirmation=1" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M10 15.5v-7l6 3.5-6 3.5zM21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.4a2.8 2.8 0 0 0-2 2A29.4 29.4 0 0 0 2 12a29.4 29.4 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.4 7.6.4 7.6.4s5.9 0 7.6-.4a2.8 2.8 0 0 0 2-2A29.4 29.4 0 0 0 22 12a29.4 29.4 0 0 0-.4-4.8z"/></svg>
      <span data-i18n="subscribe">Subscribe</span>
    </a>
  </div>

  <div class="section-head">
    <h2 data-i18n="latest">Latest Videos</h2>
    <span class="badge" id="count" style="display:none">0</span>
    <div class="line"></div>
  </div>

  <div id="videos">
    <div class="state" id="loading">
      <div class="spinner"></div>
      <span data-i18n="loading">Loading latest videos…</span>
    </div>
  </div>

  <footer><span data-i18n="footer">© 2026 Disereless — YouTube Hub</span></footer>
</div>

<script>
const I18N = {
  en: {
    back: '← Back to all links',
    handle: '@disereless on YouTube',
    desc: 'Iraqi speedrunner 🎮 God of War speedruns — the easiest skips and the fastest routes through every stage. New guides and runs on the channel.',
    subscribe: 'Subscribe',
    latest: 'Latest Videos',
    loading: 'Loading latest videos…',
    footer: '© 2026 Disereless — YouTube Hub',
    watch: 'Watch on YouTube ↗',
    none: 'No public videos found right now.',
    visit: 'Visit the channel on YouTube ↗'
  },
  ar: {
    back: '→ رجوع لكل الروابط',
    handle: '@disereless على يوتيوب',
    desc: 'سبيد رنر عراقي 🎮 سبيد رن إله الحرب — أسهل التخطيات وأسرع الطرق بكل مرحلة. شروحات ورنات جديدة على القناة.',
    subscribe: 'اشترك',
    latest: 'آخر الفيديوهات',
    loading: 'جاري تحميل آخر الفيديوهات…',
    footer: '© 2026 Disereless — صفحة اليوتيوب',
    watch: 'شاهد على يوتيوب ↗',
    none: 'ماكو فيديوهات عامة حالياً.',
    visit: 'زور القناة على يوتيوب ↗'
  }
};

let LANG = 'en';
try{ LANG = localStorage.getItem('lang') || 'en'; }catch(e){}

const sw = document.getElementById('langSwitch');

function setLang(lang){
  LANG = lang;
  const t = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const k = el.getAttribute('data-i18n');
    if(t[k]) el.innerHTML = t[k];
  });
  document.documentElement.lang = lang;
  document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  sw.classList.toggle('ar', lang === 'ar');
  sw.querySelectorAll('.opt').forEach(function(o){
    o.classList.toggle('active', o.getAttribute('data-lang') === lang);
  });
  document.querySelectorAll('.video-link').forEach(function(a){ a.textContent = t.watch; });
  try{ localStorage.setItem('lang', lang); }catch(e){}
}

sw.addEventListener('click', function(){
  setLang(LANG === 'ar' ? 'en' : 'ar');
});

if(LANG === 'ar') setLang('ar');

const CHANNEL_ID = 'UC_Myh5uLQ53eyBGOrqkyjAw';
const RSS = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + CHANNEL_ID;
const container = document.getElementById('videos');

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function fmtDate(iso){
  try{
    return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return ''; }
}

function render(items){
  if(!items.length){ return fallback(); }
  document.getElementById('count').textContent = items.length;
  document.getElementById('count').style.display = 'inline-block';

  const grid = document.createElement('div');
  grid.className = 'grid';

  items.forEach(function(v, i){
    const card = document.createElement('div');
    card.className = 'video-card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML =
      '<div class="thumb" data-id="' + esc(v.id) + '">' +
        '<img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" alt="' + esc(v.title) + '">' +
        '<div class="play-btn"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></div>' +
      '</div>' +
      '<div class="video-meta">' +
        '<div class="video-title">' + esc(v.title) + '</div>' +
        '<div class="meta-row">' +
          '<span class="video-date">' + fmtDate(v.date) + '</span>' +
          '<a class="video-link" href="https://www.youtube.com/watch?v=' + esc(v.id) + '" target="_blank" rel="noopener">' + I18N[LANG].watch + '</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);

  // click thumbnail -> swap to embedded player
  grid.addEventListener('click', function(e){
    const thumb = e.target.closest('.thumb');
    if(!thumb) return;
    const id = thumb.getAttribute('data-id');
    thumb.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
      '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
}

function fallback(){
  container.innerHTML =
    '<div class="state">' + I18N[LANG].none + '<br><br>' +
    '<a href="https://www.youtube.com/@disereless" target="_blank" rel="noopener">' + I18N[LANG].visit + '</a></div>';
}

function parseXML(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  const entries = doc.querySelectorAll('entry');
  const items = [];
  entries.forEach(function(en){
    const idEl = en.getElementsByTagName('yt:videoId')[0];
    const tEl = en.getElementsByTagName('title')[0];
    const pEl = en.getElementsByTagName('published')[0];
    if(idEl && tEl){
      items.push({ id: idEl.textContent, title: tEl.textContent, date: pEl ? pEl.textContent : '' });
    }
  });
  return items;
}

// Try direct RSS first (works if opened without CORS limits), then rss2json fallback
fetch(RSS)
  .then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(t){
    const items = parseXML(t);
    if(items.length) render(items); else throw 0;
  })
  .catch(function(){
    fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.items && data.items.length){
          render(data.items.map(function(it){
            const id = (it.link || '').split('v=')[1] || (it.guid || '').split(':').pop();
            return { id: id, title: it.title, date: it.pubDate };
          }).filter(function(v){ return v.id; }));
        } else { fallback(); }
      })
      .catch(fallback);
  });
</script>
</body>
</html>

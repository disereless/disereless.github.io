<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e6def5">
<script>
  /* Apply saved theme before first paint (no flash). Falls back to the OS setting. */
  (function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
    if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);})();
</script>
<title>Disereless — YouTube Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same color/style tokens as index.html — keep both files matching if you edit these */
  :root{
    /* ===== LIGHT THEME (default) — neobrutalist look, softer colors ===== */
    color-scheme:light;
    --bg:#cfc6df;          /* page: soft lilac instead of the harsh purple */
    --paper:#fbf8f1;       /* cards: warm off-white */
    --paper-2:#fbf8f1;
    --featured:#fbe6a4;    /* highlighted card: soft butter yellow */
    --featured-line:#1d1a26;
    --ink:#1d1a26;         /* text (soft near-black, not pure black) */
    --muted:#5d5769;       /* secondary text */
    --line:#1d1a26;        /* outlines */
    --shade:#1d1a26;       /* hard shadows */
    --grid:rgba(29,26,38,.055);
    --overlay:rgba(29,26,38,.55);
    --purple:#6f56e6;
    --link:#5a41d4;        /* purple used for text/links */
    --pink:#ee7bab;
    --yellow:#f5c65a;
    --mint:#5fd1ab;
    --red:#ea5f5f;
    --tt:#1d1a26;          /* TikTok icon bg */
    --bw:3px;
    --border:var(--bw) solid var(--line);
    --shadow:6px 6px 0 var(--shade);
    --shadow-sm:4px 4px 0 var(--shade);
    --shadow-hover:7px 7px 0 var(--shade);
  }
  /* ===== DARK THEME — neutral dark gray (no blue tint) ===== */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1c1c1e;
    --paper:#272729;
    --paper-2:#313134;
    --featured:#313134;
    --featured-line:#8f7cf0;
    --ink:#e6e6e8;
    --muted:#a7a7ae;
    --line:#48484d;
    --shade:#0c0c0d;
    --grid:rgba(255,255,255,.03);
    --overlay:rgba(0,0,0,.72);
    --purple:#7461e8;
    --link:#b5abff;
    --pink:#d96a98;
    --yellow:#e6b95c;
    --mint:#62c8a6;
    --red:#dc5f5f;
    --tt:#101011;
    --bw:2px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    /* Cairo listed as a fallback here too, so Arabic characters (e.g. "عربي"
       in the toggle) always render in Cairo, even while the page is in
       English mode — see index.html for the full explanation. */
    font-family:'Space Grotesk','Cairo',sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    /* faint grid-paper background */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px;-webkit-font-smoothing:antialiased;background-position:-1px -1px;
  }
  body[dir="rtl"]{font-family:'Cairo','Space Grotesk',sans-serif}

  /* ===== LANGUAGE TOGGLE (same behavior as index.html) ===== */
    /* ===== TOOLBAR: theme slider + language slider, fixed at top ===== */
  .toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;direction:ltr}
  .lang-switch,.theme-switch{
    position:relative;display:flex;align-items:center;direction:ltr;
    background:var(--paper);border:var(--border);border-radius:999px;
    padding:4px;cursor:pointer;user-select:none;box-shadow:var(--shadow-sm);
  }
  .theme-switch .opt{position:relative;z-index:2;padding:7px 12px;border-radius:999px;color:var(--muted);transition:color .2s ease;display:flex;align-items:center}
  .theme-switch .opt.active{color:#fff}
  .theme-switch .opt svg{width:18px;height:18px}
  .theme-switch.dark .lang-knob{transform:translateX(100%)}
  body{transition:background-color .25s ease,color .25s ease}
  .lang-switch .opt{position:relative;z-index:2;padding:7px 18px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);transition:color .2s ease}
  .lang-switch .opt.active{color:#fff}
  .lang-knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--purple);border:2px solid var(--line);transition:transform .25s cubic-bezier(.2,1,.4,1);z-index:1}
  .lang-switch.ar .lang-knob{transform:translateX(100%)}

  .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:78px 20px 60px}

  /* "← Back to all links" pill */
  .back{
    display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;
    padding:9px 18px;border:var(--border);background:var(--paper);box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .back:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-hover)}

  /* ===== TOP HERO CARD (avatar + name + subscribe button) ===== */
  .hero{
    margin-top:26px;background:var(--paper);border:var(--border);box-shadow:var(--shadow);
    padding:34px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  }
  .hero-avatar{
    width:92px;height:92px;border:var(--border);background:var(--red);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);
    transform:rotate(-3deg);
  }
  .hero-avatar svg{width:44px;height:44px}
  .hero-info{flex:1;min-width:230px}
  .hero-info h1{font-size:30px;font-weight:700}
  .hero-info h1 .ar{font-family:'Cairo',sans-serif;color:var(--link);font-size:22px;font-weight:700}
  .hero-handle{
    color:#0f2b22;display:inline-block;margin-top:8px;background:var(--mint);border:2px solid var(--line);
    padding:3px 12px;font-weight:700;font-size:13px;
  }
  .hero-desc{color:var(--ink);font-size:14.5px;margin-top:12px;line-height:1.65;max-width:560px;font-weight:500}
  .btn{
    display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border:var(--border);
    text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap;
    box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-sub{background:var(--red);color:#fff} /* the red "Subscribe" button */
  .btn-sub:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-hover)}
  .btn svg{width:20px;height:20px}

  /* "Latest Videos" heading + the count badge + the horizontal rule next to it */
  .section-head{display:flex;align-items:center;gap:14px;margin:46px 0 22px}
  .section-head h2{font-size:22px;font-weight:700}
  .section-head .line{flex:1;height:4px;background:var(--line)}
  .badge{background:var(--purple);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border:2px solid var(--line)} /* shows video count, filled in by JS */

  /* ===== VIDEO GRID (filled in by JS once videos load) ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .video-card{
    background:var(--paper);border:var(--border);overflow:hidden;
    box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .12s ease;
  }
  .video-card:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-hover)}
  /* clicking .thumb swaps the thumbnail image for a live YouTube embed — see JS */
  .thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden;border-bottom:var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  .thumb:hover img{transform:scale(1.05)}
  .play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .play-btn span{
    width:56px;height:56px;background:var(--yellow);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--shade);
    transition:transform .15s ease;
  }
  .thumb:hover .play-btn span{transform:scale(1.08)}
  .play-btn svg{fill:#1b1608;width:22px;height:22px;margin-left:3px}
  .thumb iframe{width:100%;height:100%;border:0;display:block} /* only exists after a click, added by JS */
  .video-meta{padding:15px 16px 17px}
  .video-title{
    font-weight:700;font-size:15px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; /* clips title to 2 lines */
    font-family:'Cairo','Space Grotesk',sans-serif;
  }
  .video-date{color:var(--muted);font-size:13px;margin-top:7px;font-weight:500}
  .video-link{color:var(--link);font-size:13px;font-weight:700;text-decoration:none}
  .video-link:hover{text-decoration:underline}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px}

  /* Shown while videos are loading, and again if none are found (see fallback() in JS) */
  .state{
    text-align:center;padding:70px 20px;color:var(--ink);font-weight:500;
    background:var(--paper);border:var(--border);box-shadow:var(--shadow-sm);
  }
  .state a{color:var(--link);font-weight:700;text-decoration:none}
  .state a:hover{text-decoration:underline}
  .loader-box{width:36px;height:36px;margin:0 auto 18px;background:var(--yellow);border:2px solid var(--line);animation:spin 1s steps(4) infinite} /* chunky 4-step spin instead of a smooth circle */
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{color:var(--ink);font-size:13px;font-weight:700;text-align:center;margin-top:56px}
  footer span{background:var(--purple);color:#fff;padding:2px 10px;border:2px solid var(--line)}

  /* smaller screens: shrink the hero padding + heading */
  @media (max-width:600px){
    .hero{padding:26px 22px}
    .hero-info h1{font-size:24px}
  }
  /* ===== تحسينات بسيطة ===== */
  a:focus-visible,.lang-switch:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:3px}
  ::selection{background:var(--purple);color:#fff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="toolbar">
  <div class="theme-switch" id="themeSwitch" role="button" aria-label="Toggle light / dark theme">
    <div class="lang-knob"></div>
    <div class="opt active" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div class="opt" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
  </div>
  <div class="lang-switch" id="langSwitch">
    <div class="lang-knob"></div>
    <div class="opt active" data-lang="en">EN</div>
    <div class="opt" data-lang="ar">عربي</div>
  </div>
</div>

<div class="wrap">
  <a class="back" href="index.html" data-i18n="back">← Back to all links</a>

  <div class="hero">
    <!-- Just an icon here (not a photo). If you want your real photo instead,
         replace this <svg> with an <img src="avatar.png"> like on index.html. -->
    <div class="hero-avatar">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M10 15.5v-7l6 3.5-6 3.5z"/><path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.4a2.8 2.8 0 0 0-2 2A29.4 29.4 0 0 0 2 12a29.4 29.4 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.4 7.6.4 7.6.4s5.9 0 7.6-.4a2.8 2.8 0 0 0 2-2A29.4 29.4 0 0 0 22 12a29.4 29.4 0 0 0-.4-4.8z" fill="none" stroke="#fff" stroke-width="1.4"/></svg>
    </div>
    <div class="hero-info">
      <h1>Disereless <span class="ar">— حارث</span></h1>
      <div class="hero-handle" data-i18n="handle">@disereless on YouTube</div>
      <p class="hero-desc" data-i18n="desc">Iraqi speedrunner 🎮 God of War speedruns — the easiest skips and the fastest routes through every stage. New guides and runs on the channel.</p>
    </div>
    <a class="btn btn-sub" href="https://www.youtube.com/@disereless?sub_confirmation=1" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M10 15.5v-7l6 3.5-6 3.5zM21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.4a2.8 2.8 0 0 0-2 2A29.4 29.4 0 0 0 2 12a29.4 29.4 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.4 7.6.4 7.6.4s5.9 0 7.6-.4a2.8 2.8 0 0 0 2-2A29.4 29.4 0 0 0 22 12a29.4 29.4 0 0 0-.4-4.8z"/></svg>
      <span data-i18n="subscribe">Subscribe</span>
    </a>
  </div>

  <div class="section-head">
    <h2 data-i18n="latest">Latest Videos</h2>
    <span class="badge" id="count" style="display:none">0</span> <!-- JS fills in the number and un-hides this -->
    <div class="line"></div>
  </div>

  <!-- This whole box gets replaced by JS: first shows the loading spinner,
       then either the video grid or the "no videos found" message. -->
  <div id="videos">
    <div class="state" id="loading">
      <div class="loader-box"></div>
      <span data-i18n="loading">Loading latest videos…</span>
    </div>
  </div>

  <footer><span data-i18n="footer">© 2026 Disereless — YouTube Hub</span></footer>
</div>

<script>
// Same translation-table idea as index.html — one object per language.
const I18N = {
  en: {
    back: '← Back to all links',
    handle: '@disereless on YouTube',
    desc: 'Iraqi speedrunner 🎮 God of War speedruns — the easiest skips and the fastest routes through every stage. New guides and runs on the channel.',
    subscribe: 'Subscribe',
    latest: 'Latest Videos',
    loading: 'Loading latest videos…',
    footer: '© 2026 Disereless — YouTube Hub',
    watch: 'Watch on YouTube ↗',
    none: 'No public videos found right now.',
    visit: 'Visit the channel on YouTube ↗'
  },
  ar: {
    back: '→ رجوع لكل الروابط',
    handle: '@disereless على يوتيوب',
    desc: 'سبيد رنر عراقي 🎮 سبيد رن إله الحرب — أسهل التخطيات وأسرع الطرق بكل مرحلة. شروحات ورنات جديدة على القناة.',
    subscribe: 'اشترك',
    latest: 'آخر الفيديوهات',
    loading: 'جاري تحميل آخر الفيديوهات…',
    footer: '© 2026 Disereless — صفحة اليوتيوب',
    watch: 'شاهد على يوتيوب ↗',
    none: 'ماكو فيديوهات عامة حالياً.',
    visit: 'زور القناة على يوتيوب ↗'
  }
};

// LANG tracks the current language so render() knows which "Watch on YouTube"
// label to print on freshly-built video cards.
let LANG = 'en';
try{ LANG = localStorage.getItem('lang') || 'en'; }catch(e){}


  // ===== THEME SLIDER (light / dark) — choice is saved and shared between both pages =====
  const themeSw = document.getElementById('themeSwitch');
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeSw.classList.toggle('dark', t === 'dark');
    themeSw.querySelectorAll('.opt').forEach(function(o){
      o.classList.toggle('active', o.getAttribute('data-theme') === t);
    });
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#1c1c1e' : '#e6def5');
    try{ localStorage.setItem('theme', t); }catch(e){}
  }
  themeSw.addEventListener('click', function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  setTheme(document.documentElement.getAttribute('data-theme') || 'light');

  const sw = document.getElementById('langSwitch');

// Swaps all data-i18n text, flips direction, moves the toggle knob,
// and re-labels any already-rendered "Watch on YouTube" links.
function setLang(lang){
  LANG = lang;
  const t = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const k = el.getAttribute('data-i18n');
    if(t[k]) el.innerHTML = t[k];
  });
  document.documentElement.lang = lang;
  document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  sw.classList.toggle('ar', lang === 'ar');
  sw.querySelectorAll('.opt').forEach(function(o){
    o.classList.toggle('active', o.getAttribute('data-lang') === lang);
  });
  document.querySelectorAll('.video-link').forEach(function(a){ a.textContent = t.watch; });
  try{ localStorage.setItem('lang', lang); }catch(e){}
}

sw.addEventListener('click', function(){
  setLang(LANG === 'ar' ? 'en' : 'ar');
});

// Restore whichever language was picked on index.html (shared via localStorage)
if(LANG === 'ar') setLang('ar');

// ===== FETCHING YOUR LATEST VIDEOS =====
// YouTube publishes a free RSS feed for every channel at this URL pattern.
// CHANNEL_ID identifies your channel — change this if you ever switch channels.
const CHANNEL_ID = 'UC_Myh5uLQ53eyBGOrqkyjAw';
const RSS = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + CHANNEL_ID;
const container = document.getElementById('videos');

// Escapes text so a video title can never break the HTML we're building
// (prevents both broken layout and security issues).
function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Turns a raw ISO date string (e.g. "2026-01-05T10:00:00Z") into "Jan 5, 2026"
function fmtDate(iso){
  try{
    return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return ''; }
}

// Builds the video grid from a list of {id, title, date} objects and drops it
// into the page. Also wires up "click thumbnail -> play video" for every card.
function render(items){
  if(!items.length){ return fallback(); }
  document.getElementById('count').textContent = items.length;
  document.getElementById('count').style.display = 'inline-block';

  const grid = document.createElement('div');
  grid.className = 'grid';

  items.forEach(function(v, i){
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML =
      '<div class="thumb" data-id="' + esc(v.id) + '">' +
        '<img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" alt="' + esc(v.title) + '">' +
        '<div class="play-btn"><span><svg viewBox="0 0 24 24" fill="#1b1608"><path d="M8 5v14l11-7z"/></svg></span></div>' +
      '</div>' +
      '<div class="video-meta">' +
        '<div class="video-title">' + esc(v.title) + '</div>' +
        '<div class="meta-row">' +
          '<span class="video-date">' + fmtDate(v.date) + '</span>' +
          '<a class="video-link" href="https://www.youtube.com/watch?v=' + esc(v.id) + '" target="_blank" rel="noopener">' + I18N[LANG].watch + '</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(grid);

  // One listener on the whole grid (instead of one per card) catches clicks
  // on any thumbnail and swaps it for a real embedded, autoplaying player.
  grid.addEventListener('click', function(e){
    const thumb = e.target.closest('.thumb');
    if(!thumb) return;
    const id = thumb.getAttribute('data-id');
    thumb.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
      '?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  });
}

// Shown if no videos come back from either fetch attempt below
function fallback(){
  container.innerHTML =
    '<div class="state">' + I18N[LANG].none + '<br><br>' +
    '<a href="https://www.youtube.com/@disereless" target="_blank" rel="noopener">' + I18N[LANG].visit + '</a></div>';
}

// Reads YouTube's raw RSS/XML feed and pulls out {id, title, date} for each video entry
function parseXML(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  const entries = doc.querySelectorAll('entry');
  const items = [];
  entries.forEach(function(en){
    const idEl = en.getElementsByTagName('yt:videoId')[0];
    const tEl = en.getElementsByTagName('title')[0];
    const pEl = en.getElementsByTagName('published')[0];
    if(idEl && tEl){
      items.push({ id: idEl.textContent, title: tEl.textContent, date: pEl ? pEl.textContent : '' });
    }
  });
  return items;
}

// Plan A: fetch YouTube's RSS feed directly.
// Plan B (if Plan A is blocked by the browser, which sometimes happens with RSS feeds):
//   fall back to a free RSS-to-JSON proxy service instead.
// Plan C: if both fail or return zero videos, show the "no videos found" message.
fetch(RSS)
  .then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(t){
    const items = parseXML(t);
    if(items.length) render(items); else throw 0;
  })
  .catch(function(){
    fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.items && data.items.length){
          render(data.items.map(function(it){
            const id = (it.link || '').split('v=')[1] || (it.guid || '').split(':').pop();
            return { id: id, title: it.title, date: it.pubDate };
          }).filter(function(v){ return v.id; }));
        } else { fallback(); }
      })
      .catch(fallback);
  });
</script>
</body>
</html>
